
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Clothing Advisor</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            width: 460px;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #6b7280;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 18px;
            background: #2563eb;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 24px;
            background: #f9fafb;
            border-left: 5px solid #2563eb;
            padding: 18px;
            border-radius: 12px;
            white-space: pre-wrap;
            color: #111827;
            display: none;
        }

        .loading {
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🌦️ Weather Clothing Advisor</h1>
    <p>Enter your location and get weather-based clothing advice.</p>

    <input
        type="text"
        id="location"
        placeholder="Example: Delhi, Mumbai, London"
    >

    <button onclick="getWeatherAdvice()">Get Advice</button>

    <div id="result"></div>
</div>

<script>
async function getWeatherAdvice() {
    const locationInput = document.getElementById("location");
    const resultDiv = document.getElementById("result");

    const location = locationInput.value.trim();

    resultDiv.style.display = "block";

    if (!location) {
        resultDiv.innerText = "Please enter a location.";
        return;
    }

    resultDiv.innerHTML = '<span class="loading">Fetching weather and clothing advice...</span>';

    try {
        const response = await fetch("/weather-clothing", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                location: location
            })
        });

        const data = await response.json();

        if (!response.ok) {
            resultDiv.innerText = "Error: " + (data.detail || "Request failed.");
            return;
        }

        resultDiv.innerText =
            "📍 Location: " + data.location + "\n\n" +
            "🌤️ Weather Information:\n" + data.weather_summary + "\n\n" +
            "👕 Clothing Advice:\n" + data.clothing_advice;

    } catch (error) {
        resultDiv.innerText = "Network or server error: " + error.message;
    }
}
</script>

</body>
</html>
