
<!DOCTYPE html>
<html>
<head>
    <title>Weather Clothing Advisor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #result {
            margin-top: 25px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            white-space: pre-wrap;
            color: #111827;
        }
    </style>

</head>

<body>

    <div class="card">

        <h1>🌦️ Weather Clothing Advisor</h1>

        <input
            id="location"
            placeholder="Enter location e.g. Delhi, Tokyo, London"
        >

        <button onclick="getAdvice()">
            Get Clothing Advice
        </button>

        <div id="result"></div>

    </div>

<script>

async function getAdvice() {

    const location = document.getElementById("location").value;

    const result = document.getElementById("result");

    if (!location.trim()) {

        result.innerText = "Please enter a location.";

        return;
    }

    result.innerText = "Checking weather...";

    try {

        const response = await fetch("/weather-clothing", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                location: location
            })
        });

        const data = await response.json();

        result.innerText =
            "Location: " + data.location + "\n\n" +
            "Weather Information:\n" +
            data.weather_summary + "\n\n" +
            "Clothing Advice:\n" +
            data.clothing_advice;

    } catch(error) {

        result.innerText = "Error: " + error;
    }
}

</script>

</body>
</html>
